name: refresh-profile

on:
  schedule:
    - cron: "0 9 * * *"   # daily, 06:00 BRT
  workflow_dispatch:
  push:
    paths: ["scripts/**", ".github/workflows/refresh.yml"]

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: extract → transform → render
        run: python scripts/generate.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: commit
        run: |
          git config user.name "profile-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --cached --quiet || git commit -m "chore(pipeline): refresh live cards"
          git push
