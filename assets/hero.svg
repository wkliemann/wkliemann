<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="William Kliemann — data, platform and AI agents">
<style>
.s{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.f{opacity:0;animation:f .8s ease-out forwards}
@keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.e{fill:none;stroke:#1e2a3d;stroke-width:1.5}
.flow{fill:none;stroke-width:2;stroke-dasharray:6 14;animation:flow 1.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-40}}
.n{animation:p 3s ease-in-out infinite}
@keyframes p{50%{stroke-opacity:.25}}
.cur{animation:b 1s step-end infinite}
@keyframes b{50%{opacity:0}}
.lbl{font-size:10.5px;fill:#5f6f89;letter-spacing:.06em}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0f17"/><stop offset="1" stop-color="#111a2b"/></linearGradient>
<linearGradient id="t" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset=".55" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
<radialGradient id="glow" cx=".78" cy=".5" r=".45"><stop offset="0" stop-color="#a78bfa" stop-opacity=".18"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0v24" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
</defs>

<rect width="1000" height="280" rx="16" fill="url(#bg)"/>
<rect width="1000" height="280" rx="16" fill="url(#grid)"/>
<rect width="1000" height="280" rx="16" fill="url(#glow)"/>

<!-- left: identity -->
<g class="f" style="animation-delay:.1s">
<text x="48" y="72" class="m" font-size="13" fill="#34d399">❯ whoami<tspan class="cur" fill="#34d399"> ▍</tspan></text>
</g>
<g class="f" style="animation-delay:.35s">
<text x="46" y="128" class="s" font-size="46" font-weight="800" fill="url(#t)" letter-spacing="-1">William Kliemann</text>
</g>
<g class="f" style="animation-delay:.6s">
<text x="48" y="162" class="s" font-size="18" fill="#c9d4e5">Head of Data · DevOps · Platform</text>
</g>
<g class="f" style="animation-delay:.85s">
<text x="48" y="200" class="m" font-size="13" fill="#5f6f89">// raw data → pipelines → warehouse → <tspan fill="#a78bfa">agents</tspan> → decisions</text>
</g>
<g class="f m" style="animation-delay:1.1s" font-size="11">
<rect x="48" y="222" width="92" height="24" rx="12" fill="#22d3ee" fill-opacity=".1" stroke="#22d3ee" stroke-opacity=".4"/>
<text x="94" y="238" text-anchor="middle" fill="#22d3ee">data eng</text>
<rect x="148" y="222" width="92" height="24" rx="12" fill="#a78bfa" fill-opacity=".1" stroke="#a78bfa" stroke-opacity=".4"/>
<text x="194" y="238" text-anchor="middle" fill="#a78bfa">ai agents</text>
<rect x="248" y="222" width="92" height="24" rx="12" fill="#34d399" fill-opacity=".1" stroke="#34d399" stroke-opacity=".4"/>
<text x="294" y="238" text-anchor="middle" fill="#34d399">platform</text>
<rect x="348" y="222" width="92" height="24" rx="12" fill="#f472b6" fill-opacity=".1" stroke="#f472b6" stroke-opacity=".4"/>
<text x="394" y="238" text-anchor="middle" fill="#f472b6">devops</text>
</g>

<!-- right: live pipeline graph -->
<g class="f" style="animation-delay:.5s">
<text x="590" y="44" class="m lbl">SOURCES</text>
<text x="730" y="44" class="m lbl">WAREHOUSE</text>
<text x="868" y="44" class="m lbl">AGENTS</text>
<text x="938" y="44" class="m lbl" style="fill:#34d399">OUT</text>

<!-- edges (static) -->
<path class="e" d="M626 80 C680 80 700 140 744 140"/>
<path class="e" d="M626 140 L744 140"/>
<path class="e" d="M626 200 C680 200 700 140 744 140"/>
<path class="e" d="M776 140 C820 140 840 92 880 92"/>
<path class="e" d="M776 140 C820 140 840 188 880 188"/>
<path class="e" d="M913 92 C940 92 946 120 948 134"/>
<path class="e" d="M913 188 C940 188 946 160 948 146"/>

<!-- edges (flowing) -->
<path class="flow" stroke="#22d3ee" d="M626 80 C680 80 700 140 744 140"/>
<path class="flow" stroke="#22d3ee" style="animation-delay:-.5s" d="M626 140 L744 140"/>
<path class="flow" stroke="#22d3ee" style="animation-delay:-.9s" d="M626 200 C680 200 700 140 744 140"/>
<path class="flow" stroke="#a78bfa" style="animation-duration:1s" d="M776 140 C820 140 840 92 880 92"/>
<path class="flow" stroke="#a78bfa" style="animation-duration:1s;animation-delay:-.4s" d="M776 140 C820 140 840 188 880 188"/>

<path class="flow" stroke="#34d399" style="animation-duration:.9s" d="M913 92 C940 92 946 120 948 134"/>
<path class="flow" stroke="#34d399" style="animation-duration:.9s;animation-delay:-.45s" d="M913 188 C940 188 946 160 948 146"/>

<!-- source nodes -->
<g class="m" font-size="10" text-anchor="middle">
<rect x="566" y="66" width="60" height="28" rx="6" fill="#0f1522" stroke="#22d3ee" class="n"/>
<text x="596" y="84" fill="#c9d4e5">events</text>
<rect x="566" y="126" width="60" height="28" rx="6" fill="#0f1522" stroke="#22d3ee" class="n" style="animation-delay:-1s"/>
<text x="596" y="144" fill="#c9d4e5">ads</text>
<rect x="566" y="186" width="60" height="28" rx="6" fill="#0f1522" stroke="#22d3ee" class="n" style="animation-delay:-2s"/>
<text x="596" y="204" fill="#c9d4e5">apis</text>

<!-- warehouse -->
<circle cx="760" cy="140" r="26" fill="#0f1522" stroke="#22d3ee" stroke-width="1.5"/>
<circle cx="760" cy="140" r="26" fill="none" stroke="#22d3ee" stroke-opacity=".5">
  <animate attributeName="r" values="26;40" dur="2.4s" repeatCount="indefinite"/>
  <animate attributeName="stroke-opacity" values=".5;0" dur="2.4s" repeatCount="indefinite"/>
</circle>
<text x="760" y="136" fill="#22d3ee" font-size="9">gold</text>
<text x="760" y="149" fill="#c9d4e5">dw</text>

<!-- agents -->
<circle cx="896" cy="92" r="17" fill="#0f1522" stroke="#a78bfa" stroke-width="1.5" class="n"/>
<text x="896" y="96" fill="#a78bfa" font-size="11">◆</text>
<circle cx="896" cy="188" r="17" fill="#0f1522" stroke="#a78bfa" stroke-width="1.5" class="n" style="animation-delay:-1.5s"/>
<text x="896" y="192" fill="#a78bfa" font-size="11">◆</text>
<text x="896" y="124" fill="#5f6f89" font-size="9">mcp</text>
<text x="896" y="221" fill="#5f6f89" font-size="9">llm</text>

<!-- output -->
<circle cx="952" cy="140" r="6" fill="#34d399">
  <animate attributeName="opacity" values="1;.3;1" dur="1.6s" repeatCount="indefinite"/>
</circle>
</g>
</g>
</svg>
